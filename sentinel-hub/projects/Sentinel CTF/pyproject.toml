[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ctf"
version = "1.0.0"
description = "Sentinel CTF Framework — challenge workspace, tool automation, and Kali executor"
authors = [{ name = "Jack" }]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.14",
    "paramiko>=3.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "aiofiles>=23.2",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "click>=8.1,<8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ctf = "sentinel_ctf.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_ctf*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
