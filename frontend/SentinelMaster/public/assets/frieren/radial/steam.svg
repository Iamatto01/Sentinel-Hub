    <circle cx="28" cy="-28" r="14" fill="#ffffff"/>
    <line x1="28" y1="-28" x2="-25" y2="25" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-32" cy="32" r="24" fill="none" stroke="#66c0f4" stroke-width="8"/>
