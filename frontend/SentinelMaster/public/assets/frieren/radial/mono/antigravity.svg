<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>
  <!-- Quantum Levitation Diamond / Prism -->
  <g transform="translate(50, 50) scale(0.75)">
    <!-- Outer Octagon Ring -->
    <polygon points="0,-48 34,-34 48,0 34,34 0,48 -34,34 -48,0 -34,-34" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <!-- Inverted Core Crystal -->
    <polygon points="0,-36 32,-10 0,38 -32,-10" fill="url(#prism-grad)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Facet Refraction -->
    <polygon points="0,-36 0,38 -32,-10" fill="#ffffff" opacity="0.3"/>
    <circle cx="0" cy="-6" r="5" fill="#ffffff"/>
    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="42" ry="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-25)" opacity="0.7"/>
  </g>
</svg>
