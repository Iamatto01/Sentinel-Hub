<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#003566"/>
      <stop offset="60%" stop-color="#001833"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>
    <linearGradient id="vscode-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007acc"/>
      <stop offset="50%" stop-color="#0098ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Editor Grid Background Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="40" y1="60" x2="180" y2="60"/>
    <line x1="60" y1="80" x2="240" y2="80"/>
    <line x1="40" y1="100" x2="140" y2="100"/>
    <line x1="60" y1="120" x2="200" y2="120"/>
    <line x1="40" y1="140" x2="160" y2="140"/>
    <line x1="40" y1="300" x2="260" y2="300"/>
    <line x1="60" y1="320" x2="190" y2="320"/>
  </g>
  
  <!-- Glowing Center Ambient -->
  <circle cx="200" cy="190" r="90" fill="#0098ff" opacity="0.22" filter="url(#glow)"/>
  
  <!-- Official VS Code Fold Icon -->
  <g transform="translate(115, 105) scale(0.35)" filter="url(#glow)">
    <path fill="#0065a9" d="M370.4 461.2L124.9 260.6 370.4 60.1z"/>
    <path fill="#007acc" d="M370.4 60.1l-245.5 200.5 245.5 200.6 86.8-41.9c18.5-8.9 30.3-27.7 30.3-48.4V90.3c0-20.7-11.8-39.5-30.3-48.4l-86.8 18.2z"/>
    <path fill="#1f9cf0" d="M124.9 260.6L29.3 187.2c-15.5-12-38.1-1-38.1 18.5v109.8c0 19.5 22.6 30.5 38.1 18.5l95.6-73.4z"/>
    <path fill="#3ea6ff" d="M370.4 461.2L29.3 187.2c-15.5-12-38.1-1-38.1 18.5v109.8c0 19.5 22.6 30.5 38.1 18.5l341.1 247.2 86.8-41.9c18.5-8.9 30.3-27.7 30.3-48.4V461.2l-117.2-40z"/>
  </g>
  
  <!-- Typography & App Details -->
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">VS CODE</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#38bdf8" letter-spacing="2" text-anchor="middle">CODE EDITOR</text>
  <circle cx="200" cy="360" r="3" fill="#38bdf8" opacity="0.8"/>
</svg>
