<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="exp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d2204"/>
      <stop offset="60%" stop-color="#191302"/>
      <stop offset="100%" stop-color="#090601"/>
    </radialGradient>
    <linearGradient id="folder-tab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="folder-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow-exp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#exp-bg)"/>
  <circle cx="200" cy="175" r="85" fill="#eab308" opacity="0.18" filter="url(#glow-exp)"/>
  <!-- Windows 11 File Explorer Folder Icon -->
  <g transform="translate(130, 115) scale(0.9)" filter="url(#glow-exp)">
    <!-- Back Tab (Blue) -->
    <path d="M 10 30 L 60 30 L 75 45 L 145 45 Q 155 45 155 55 L 155 110 L 10 110 Z" fill="url(#folder-tab)"/>
    <!-- Paper Sheet Inside -->
    <rect x="25" y="20" width="105" height="45" rx="4" fill="#ffffff" opacity="0.9"/>
    <!-- Front Flap (Gold/Amber) -->
    <path d="M 0 45 L 55 45 L 70 35 L 150 35 Q 160 35 160 45 L 160 115 Q 160 125 150 125 L 10 125 Q 0 125 0 115 Z" fill="url(#folder-body)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
  </g>
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">FILE EXPLORER</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#fde047" letter-spacing="2" text-anchor="middle">STORAGE &amp; DRIVES</text>
  <circle cx="200" cy="360" r="3" fill="#eab308" opacity="0.8"/>
</svg>
