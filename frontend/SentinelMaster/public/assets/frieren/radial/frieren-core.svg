<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-frieren" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#24104f"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </radialGradient>
    <linearGradient id="magic-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-frieren)"/>

  <!-- Magic Circles & Runes -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="180" r="75" fill="#a855f7" opacity="0.25" filter="url(#core-glow)"/>

  <!-- Magic Diamond Compass / Star Core -->
  <g transform="translate(200, 180) rotate(45)" filter="url(#core-glow)">
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="none" stroke="url(#magic-gold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="url(#magic-gold)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="130" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="140" r="2.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="270" cy="230" r="3.5" fill="#e879f9" opacity="0.7"/>
  <circle cx="130" cy="225" r="2" fill="#c084fc" opacity="0.8"/>

  <!-- Typography & App Details -->
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">FRIEREN OS</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#fef08a" letter-spacing="2" text-anchor="middle">AI NEURAL CORE</text>
  <circle cx="200" cy="360" r="3" fill="#fef08a" opacity="0.8"/>
</svg>
