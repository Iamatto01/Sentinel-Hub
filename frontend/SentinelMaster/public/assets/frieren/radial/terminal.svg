<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-terminal" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="60%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="amber-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="term-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-terminal)"/>

  <!-- Matrix/Scanlines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Terminal Window Silhouette -->
  <rect x="90" y="80" width="220" height="150" rx="12" fill="#181825" stroke="#313244" stroke-width="1.5" opacity="0.9"/>
  <circle cx="110" cy="100" r="5" fill="#f38ba8"/>
  <circle cx="126" cy="100" r="5" fill="#f9e2af"/>
  <circle cx="142" cy="100" r="5" fill="#a6e3a1"/>

  <!-- Prompt Command Symbol >_ -->
  <g filter="url(#term-glow)">
    <text x="115" y="175" font-family="'JetBrains Mono', Consolas, monospace" font-size="46" font-weight="900" fill="url(#amber-green)">&gt;_</text>
    <rect x="180" y="142" width="16" height="34" fill="#a6e3a1" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Typography & App Details -->
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">TERMINAL</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#f59e0b" letter-spacing="2" text-anchor="middle">POWERSHELL / CLI</text>
  <circle cx="200" cy="360" r="3" fill="#f59e0b" opacity="0.8"/>
</svg>
