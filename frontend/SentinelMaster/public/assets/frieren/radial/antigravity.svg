<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-anti" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#07020d"/>
    </radialGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="anti-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-anti)"/>

  <!-- Celestial Grid / Orbitals -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>
  <circle cx="200" cy="180" r="80" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.18"/>
  <circle cx="200" cy="180" r="60" fill="#a855f7" opacity="0.22" filter="url(#anti-glow)"/>

  <!-- Antigravity Isometric Polyhedron / Cube Core -->
  <g transform="translate(135, 115) scale(5.4)" filter="url(#anti-glow)">
    <path fill="url(#purple-glow)" d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.24l6.75 3.75L12 11.74 5.25 7.99 12 4.24zM4.5 9.25l6.75 3.75v7.5L4.5 16.75v-7.5zm15 7.5l-6.75 3.75v-7.5l6.75-3.75v7.5z"/>
  </g>

  <!-- Floating Sparkles -->
  <circle cx="130" cy="120" r="3" fill="#fdf4ff" opacity="0.7"/>
  <circle cx="270" cy="130" r="2" fill="#e879f9" opacity="0.8"/>
  <circle cx="280" cy="240" r="3.5" fill="#c084fc" opacity="0.6"/>
  <circle cx="110" cy="230" r="2" fill="#f0abfc" opacity="0.5"/>

  <!-- Typography & App Details -->
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">ANTIGRAVITY</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#c084fc" letter-spacing="2" text-anchor="middle">AGENTIC STUDIO</text>
  <circle cx="200" cy="360" r="3" fill="#c084fc" opacity="0.8"/>
</svg>
