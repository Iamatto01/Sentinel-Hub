<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vm-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1b06"/>
      <stop offset="60%" stop-color="#190e02"/>
      <stop offset="100%" stop-color="#090501"/>
    </radialGradient>
    <linearGradient id="cube-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cube-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow-vm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#vm-bg)"/>
  <circle cx="200" cy="175" r="85" fill="#f97316" opacity="0.2" filter="url(#glow-vm)"/>
  <!-- Isometric 3D VM Hypervisor Cube -->
  <g transform="translate(200, 175) scale(0.9)" filter="url(#glow-vm)">
    <!-- Top Face -->
    <polygon points="0,-60 65,-25 0,10 -65,-25" fill="url(#cube-grad2)" stroke="#fff" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-65,-25 0,10 0,80 -65,45" fill="#c2410c" stroke="#fff" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,10 65,-25 65,45 0,80" fill="url(#cube-grad1)" stroke="#fff" stroke-width="2"/>
    <!-- Network Corner Nodes -->
    <circle cx="0" cy="-60" r="5" fill="#38bdf8"/>
    <circle cx="65" cy="-25" r="5" fill="#38bdf8"/>
    <circle cx="-65" cy="-25" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="10" r="6" fill="#fef08a"/>
    <circle cx="-65" cy="45" r="5" fill="#38bdf8"/>
    <circle cx="65" cy="45" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="80" r="5" fill="#38bdf8"/>
  </g>
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">VM HUB</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#fdba74" letter-spacing="2" text-anchor="middle">VIRTUALBOX / KALI</text>
  <circle cx="200" cy="360" r="3" fill="#ea580c" opacity="0.8"/>
</svg>
