<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-sentinel" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01130e"/>
    </radialGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sentinel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg-sentinel)"/>

  <!-- Cyber Circuit Lines -->
  <g opacity="0.15" stroke="#34d399" stroke-width="1.5" fill="none">
    <path d="M50 180 h50 l30 -30 v-50"/>
    <circle cx="130" cy="100" r="3" fill="#34d399"/>
    <path d="M350 180 h-50 l-30 -30 v-50"/>
    <circle cx="270" cy="100" r="3" fill="#34d399"/>
    <path d="M60 250 h40 l20 20 h30"/>
    <circle cx="150" cy="270" r="3" fill="#34d399"/>
    <path d="M340 250 h-40 l-20 20 h-30"/>
    <circle cx="250" cy="270" r="3" fill="#34d399"/>
  </g>

  <!-- Glowing Center Ambient -->
  <circle cx="200" cy="180" r="75" fill="#10b981" opacity="0.22" filter="url(#sentinel-glow)"/>

  <!-- Shield Icon -->
  <g transform="translate(138, 115) scale(5.2)" filter="url(#sentinel-glow)">
    <path fill="url(#emerald-glow)" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
  </g>

  <!-- Typography & App Details -->
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">SENTINEL AI</text>
  <text x="200" y="340" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#34d399" letter-spacing="2" text-anchor="middle">CYBERSECURITY</text>
  <circle cx="200" cy="360" r="3" fill="#34d399" opacity="0.8"/>
</svg>
